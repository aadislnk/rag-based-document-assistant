spring.application.name=askmydocs
spring.config.import=optional:file:../../.env[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:askmydocs}
spring.datasource.username=${POSTGRES_USER:askmydocs}
spring.datasource.password=${POSTGRES_PASSWORD:local-development-only}
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.document-storage-path=${DOCUMENT_STORAGE_PATH:./storage}
