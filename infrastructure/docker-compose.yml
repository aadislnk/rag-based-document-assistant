services:
  frontend:
    build: ../frontend
    environment:
      VITE_API_PROXY_TARGET: http://spring-boot:8080
    ports:
      - "5173:5173"
    depends_on:
      spring-boot:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  spring-boot:
    build: ../backend/spring-boot
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-askmydocs}
      POSTGRES_USER: ${POSTGRES_USER:-askmydocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local-development-only}
      DOCUMENT_STORAGE_PATH: /data/documents
    ports:
      - "8080:8080"
    volumes:
      - pdf-storage:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  rag-service:
    build: ../rag-service
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://askmydocs:local-development-only@postgres:5432/askmydocs}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local-development-only}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.7}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - pdf-storage:/data/documents:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-askmydocs}
      POSTGRES_USER: ${POSTGRES_USER:-askmydocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askmydocs} -d ${POSTGRES_DB:-askmydocs}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

volumes:
  postgres-data:
  redis-data:
  pdf-storage:

networks:
  edge:
  backend:
    internal: true





